parameters:
  workload: ''
  environment: ''
  owner: ''
  costCentre: ''
  serviceName: ''
  retentionInDays: 30
  storageSku: Standard_LRS
  azureDevOpsEnvironment: ''
  artifactName: deployment-results

jobs:
  - deployment: DeployApprovedWorkload
    displayName: Deploy approved workload after validation
    pool:
      vmImage: ubuntu-latest
    environment: ${{ parameters.azureDevOpsEnvironment }}
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
            - template: ../steps/resolve-and-compile.yml
              parameters:
                workload: ${{ parameters.workload }}
                environment: ${{ parameters.environment }}
                owner: ${{ parameters.owner }}
                costCentre: ${{ parameters.costCentre }}
                serviceName: ${{ parameters.serviceName }}
                retentionInDays: ${{ parameters.retentionInDays }}
                storageSku: ${{ parameters.storageSku }}
                outputDirectory: $(Pipeline.Workspace)/${{ parameters.artifactName }}
                expectedAzureDevOpsEnvironment: ${{ parameters.azureDevOpsEnvironment }}

            - task: AzureCLI@2
              displayName: Deploy after prior validation and what-if
              inputs:
                azureSubscription: $(azureServiceConnection)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  python3 scripts/azure_operation.py \
                    --action deploy \
                    --resolved "$(Pipeline.Workspace)/${{ parameters.artifactName }}/resolved-request.json" \
                    --template "$(Pipeline.Workspace)/${{ parameters.artifactName }}/template.json" \
                    --parameters "$(Pipeline.Workspace)/${{ parameters.artifactName }}/parameters.json" \
                    --output "$(Pipeline.Workspace)/${{ parameters.artifactName }}/deployment.json"

            - bash: |
                python3 scripts/deployment_summary.py \
                  --resolved "$(Pipeline.Workspace)/${{ parameters.artifactName }}/resolved-request.json" \
                  --deployment "$(Pipeline.Workspace)/${{ parameters.artifactName }}/deployment.json" \
                  --output "$(Pipeline.Workspace)/${{ parameters.artifactName }}/deployment-summary.md"
              displayName: Create deployment summary
              condition: always()

            - task: PublishPipelineArtifact@1
              displayName: Publish deployment results and summary
              condition: always()
              inputs:
                targetPath: $(Pipeline.Workspace)/${{ parameters.artifactName }}
                artifact: ${{ parameters.artifactName }}
